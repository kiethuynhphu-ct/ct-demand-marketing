                  const hasK = k!=null;
                  const p=!hasK?null:(isRatio?(act&&k?Math.round(act/k*100):null):pct(act,k));
                  const pC=p>=100?"#059669":p>=85?"#d97706":"#dc2626";
                  return (
                    <React.Fragment key={m}>
                      <td style={{...TD,borderLeft:"2px solid #f0f0f0",fontWeight:600}}>{fmt(act)}</td>
                      <td style={{...TD,color:"#9ca3af"}}>{hasK?fmt(k):"—"}</td>
                      <td style={{...TD}}>{hasK?<span style={{color:pC,fontWeight:700,fontSize:12,background:pC+"18",padding:"2px 8px",borderRadius:99}}>{p}%</span>:<span style={{color:"#d1d5db"}}>—</span>}</td>
                    </React.Fragment>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Actual by User Type — DAU/DWL only (new source has no new/return split for Lead/MAU) */}
      <div style={{...card,overflowX:"auto",marginTop:16}}>
        <div style={{fontWeight:700,fontSize:13,color:"#374151",marginBottom:2}}>👥 Actual by User Type (New vs Returning)</div>
        <div style={{fontSize:11,color:"#9ca3af",marginBottom:8}}>DAU/DWL only — Lead and MAU have no new/return split in the new source yet.</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead>
            <tr style={{background:"#f8f9ff"}}>
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",textAlign:"left",minWidth:110}}>Metric</th>
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",minWidth:80}}>User Type</th>
              {MONTHS.map(m=><th key={m} style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",whiteSpace:"nowrap"}}>{ML[m]}</th>)}
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",color:"#6b7280"}}>Avg/Total</th>
            </tr>
          </thead>
          <tbody>
            {UT_METRICS.map(met=>{
              const isLead=met.key==="lead";
              const nvVals=MONTHS.map(m=>getPlatUT(m,met.key).nv);
              const rvVals=MONTHS.map(m=>getPlatUT(m,met.key).rv);
              const nzF=vs=>vs.filter(x=>x>0).length||1;
              const smrN=isLead?nvVals.reduce((a,x)=>a+x,0):Math.round(nvVals.reduce((a,x)=>a+x,0)/nzF(nvVals));
              const smrR=isLead?rvVals.reduce((a,x)=>a+x,0):Math.round(rvVals.reduce((a,x)=>a+x,0)/nzF(rvVals));
              return [
                <tr key={met.key+'-n'} style={{borderTop:"1px solid #f0f0f0"}}>
                  <td rowSpan={2} style={{padding:"5px 8px",fontSize:12,fontWeight:600,color:met.color,textAlign:"left",verticalAlign:"middle"}}>{met.label}</td>
                  <td style={{padding:"5px 8px",fontSize:12,color:"#6366f1",fontWeight:500}}>New</td>
                  {nvVals.map((v,i)=><td key={i} style={{padding:"5px 8px",fontSize:12,textAlign:"right",color:v?"#6366f1":"#ddd"}}>{v?fmtN(v):"—"}</td>)}
                  <td style={{padding:"5px 8px",fontSize:12,textAlign:"right",fontWeight:600,color:"#6366f1",borderLeft:"1px solid #f0f0f0"}}>{fmtN(smrN)}</td>
                </tr>,
                <tr key={met.key+'-r'}>
                  <td style={{padding:"5px 8px",fontSize:12,color:"#059669",fontWeight:500}}>Returning</td>
                  {rvVals.map((v,i)=><td key={i} style={{padding:"5px 8px",fontSize:12,textAlign:"right",color:v?"#059669":"#ddd"}}>{v?fmtN(v):"—"}</td>)}
                  <td style={{padding:"5px 8px",fontSize:12,textAlign:"right",fontWeight:600,color:"#059669",borderLeft:"1px solid #f0f0f0"}}>{fmtN(smrR)}</td>
                </tr>
              ];
            })}
          </tbody>
        </table>
      </div>

      <div style={{...card,overflowX:"auto",marginTop:16}}>
        <div style={{fontWeight:700,fontSize:13,color:"#374151",marginBottom:2}}>📊 Contribution — New vs Returning (% of Total)</div>
        <div style={{fontSize:11,color:"#9ca3af",marginBottom:8}}>Share of each metric's total coming from new vs returning users each month.</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead>
            <tr style={{background:"#f8f9ff"}}>
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",textAlign:"left",minWidth:110}}>Metric</th>
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",minWidth:80}}>User Type</th>
              {MONTHS.map(m=><th key={m} style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",whiteSpace:"nowrap"}}>{ML[m]}</th>)}
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",color:"#6b7280"}}>Avg/Total</th>
            </tr>
          </thead>
          <tbody>
            {UT_METRICS.map(met=>{
              const isLead=met.key==="lead";
              const nvVals=MONTHS.map(m=>getPlatUT(m,met.key).nv);
              const rvVals=MONTHS.map(m=>getPlatUT(m,met.key).rv);
              const nzF=vs=>vs.filter(x=>x>0).length||1;
              const smrN=isLead?nvVals.reduce((a,x)=>a+x,0):Math.round(nvVals.reduce((a,x)=>a+x,0)/nzF(nvVals));
              const smrR=isLead?rvVals.reduce((a,x)=>a+x,0):Math.round(rvVals.reduce((a,x)=>a+x,0)/nzF(rvVals));
              const totVals=nvVals.map((v,i)=>v+rvVals[i]);
              const contribVals=nvVals.map((v,i)=>{
                const t=totVals[i]; return t?Math.round(v/t*100):null;
              });
              const smrTot=smrN+smrR;
              const smrContrib=smrTot?Math.round(smrN/smrTot*100):null;
              return [
                <tr key={met.key+'-cn'} style={{borderTop:"1px solid #f0f0f0"}}>
                  <td rowSpan={2} style={{padding:"5px 8px",fontSize:12,fontWeight:600,color:met.color,textAlign:"left",verticalAlign:"middle"}}>{met.label}</td>
                  <td style={{padding:"5px 8px",fontSize:12,color:"#6366f1",fontWeight:500}}>New %</td>
                  {contribVals.map((p,i)=><td key={i} style={{padding:"5px 8px",fontSize:12,textAlign:"right",color:p==null?"#ddd":"#6366f1"}}>{p==null?"—":p+"%"}</td>)}
                  <td style={{padding:"5px 8px",fontSize:12,textAlign:"right",fontWeight:600,color:smrContrib==null?"#ddd":"#6366f1",borderLeft:"1px solid #f0f0f0"}}>{smrContrib==null?"—":smrContrib+"%"}</td>
                </tr>,
                <tr key={met.key+'-cr'}>
                  <td style={{padding:"5px 8px",fontSize:12,color:"#059669",fontWeight:500}}>Returning %</td>
                  {contribVals.map((p,i)=><td key={i} style={{padding:"5px 8px",fontSize:12,textAlign:"right",color:p==null?"#ddd":"#059669"}}>{p==null?"—":100-p+"%"}</td>)}
                  <td style={{padding:"5px 8px",fontSize:12,textAlign:"right",fontWeight:600,color:smrContrib==null?"#ddd":"#059669",borderLeft:"1px solid #f0f0f0"}}>{smrContrib==null?"—":100-smrContrib+"%"}</td>
                </tr>
              ];
            })}
          </tbody>
        </table>
      </div>

      {/* DAU / DWL / Lead by Channel */}
      <ChannelSection/>

    </section>
  );
}

function ChannelSection() {
  const [ch, setCh] = useState("dau");
  const CH_METRICS = [
    {key:"dau", label:"DAU", color:"#6366f1"},
    {key:"dwl", label:"DAU w/ Lead", color:"#f59e0b"},
    {key:"lead",label:"Total Lead",  color:"#10b981"},
  ];
  const metObj = CH_METRICS.find(m=>m.key===ch);
  return (
    <div style={{...card,overflowX:"auto",marginTop:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:2}}>
        <div style={{fontWeight:700,fontSize:13,color:"#374151"}}>📡 {metObj.label} by Channel</div>
        <div style={{display:"flex",gap:4,background:"#f3f4f6",borderRadius:8,padding:3}}>
          {CH_METRICS.map(m=>(
            <button key={m.key} onClick={()=>setCh(m.key)} style={{
              padding:"5px 12px",borderRadius:6,border:"none",cursor:"pointer",
              fontSize:12,fontWeight:600,transition:"all .15s",
              background:ch===m.key?m.color:"transparent",
              color:ch===m.key?"#fff":"#6b7280",
            }}>{m.label}</button>
          ))}
        </div>
      </div>
      <div style={{fontSize:11,color:"#9ca3af",marginBottom:8}}>
        Source: ct_digital.mtm_chotot_vertical_channel, vertical=&quot;Chotot&quot;, summed across
        platform. Channels can overlap (a user active via 2+ channels the same day counts in each),
        so the sum across channels runs above the platform total by design.
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead>
          <tr style={{background:"#f8f9ff"}}>
            <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",textAlign:"left",minWidth:90}}>Channel</th>
            {MONTHS.map(m=><th key={m} style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",whiteSpace:"nowrap"}}>{ML[m]}</th>)}
            <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",color:"#6b7280"}}>Avg/Total</th>
          </tr>
        </thead>
        <tbody>
          {CHANNELS.map(c=>{
            const isLead = ch==="lead";
            const vals = MONTHS.map(m=>CHANNEL_DATA[c]?.[m]?.[ch]??0);
            const nz = vals.filter(v=>v>0).length||1;
            const smr = isLead ? vals.reduce((a,x)=>a+x,0) : Math.round(vals.reduce((a,x)=>a+x,0)/nz);
            return (
              <tr key={c} style={{borderTop:"1px solid #f0f0f0"}}>
                <td style={{padding:"5px 8px",fontSize:12,fontWeight:600,color:metObj.color,textAlign:"left"}}>{c}</td>
                {vals.map((v,i)=><td key={i} style={{padding:"5px 8px",fontSize:12,textAlign:"right",color:v?"#111":"#ddd"}}>{v?fmtN(v):"—"}</td>)}
                <td style={{padding:"5px 8px",fontSize:12,textAlign:"right",fontWeight:600,color:"#374151",borderLeft:"1px solid #f0f0f0"}}>{smr?fmtN(smr):"—"}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

const VERT_METRICS = [
  {key:"dau",    label:"DAU",         color:"#6366f1", fmt:fmtN,        isRatio:false},
  {key:"dwl",    label:"DAU w/ Lead", color:"#f59e0b", fmt:fmtN,        isRatio:false},
  {key:"lead",   label:"Total Lead",  color:"#10b981", fmt:fmtN,        isRatio:false},
  {key:"mau",    label:"MAU",         color:"#8b5cf6", fmt:fmtN,        isRatio:false},
  {key:"mauLead",label:"MAU w/ Lead", color:"#ec4899", fmt:fmtN,        isRatio:false},
  {key:"dauMau", label:"DAU/MAU",     color:"#14b8a6", fmt:n=>n+"%",    isRatio:true},
];

// ─── BREAKDOWN BY VERTICAL — same metrics as Executive Summary, split PTY/JOB/VEH/GDS ─────────
function VerticalSection() {
  const [met, setMet] = useState("dau");
  const metObj = VERT_METRICS.find(m=>m.key===met);

  const getVal = (v,m) => {
    const d = VERT_ACT[v]?.[m];
    if (!d) return null;
    if (met==="dauMau") return d.mau ? parseFloat((d.dau/d.mau*100).toFixed(1)) : null;
    return d[met] ?? null;
  };

  return (
    <section id="vertical">
      <div className="section-title">Breakdown by Vertical</div>
      <div style={{...card,overflowX:"auto"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:2}}>
          <div style={{fontWeight:700,fontSize:13,color:"#374151"}}>📈 {metObj.label} by Vertical</div>
          <div style={{display:"flex",gap:4,background:"#f3f4f6",borderRadius:8,padding:3,flexWrap:"wrap"}}>
            {VERT_METRICS.map(m=>(
              <button key={m.key} onClick={()=>setMet(m.key)} style={{
                padding:"5px 12px",borderRadius:6,border:"none",cursor:"pointer",
                fontSize:12,fontWeight:600,transition:"all .15s",
                background:met===m.key?m.color:"transparent",
                color:met===m.key?"#fff":"#6b7280",
              }}>{m.label}</button>
            ))}
          </div>
        </div>
        <div style={{fontSize:11,color:"#9ca3af",marginBottom:8}}>
          Source: chotot_mtm dashboard__dau_vertical_daily/monthly, dashboard__dauwlead__vertical_daily/monthly,
          dashboard__mauwlead__vertical_monthly — same authoritative per-vertical actuals as the production
          dashboard's By Vertical tab (unchanged this round). DAU/MAU is derived (DAU ÷ MAU) per vertical per month.
        </div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead>
            <tr style={{background:"#f8f9ff"}}>
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",textAlign:"left",minWidth:130}}>Vertical</th>
              {MONTHS.map(m=><th key={m} style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",whiteSpace:"nowrap"}}>{ML[m]}</th>)}
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",color:"#6b7280"}}>Avg/Total</th>
            </tr>
          </thead>
          <tbody>
            {VERTS.map(v=>{
              const vals = MONTHS.map(m=>getVal(v,m));
              const nz = vals.filter(x=>x!=null&&x>0).length||1;
              const numeric = vals.filter(x=>x!=null);
              const smr = numeric.length
                ? (metObj.isRatio
                    ? parseFloat((numeric.reduce((a,x)=>a+x,0)/numeric.length).toFixed(1))
                    : (met==="lead" ? numeric.reduce((a,x)=>a+x,0) : Math.round(numeric.reduce((a,x)=>a+x,0)/nz)))
                : null;
              return (
                <tr key={v} style={{borderTop:"1px solid #f0f0f0"}}>
                  <td style={{padding:"5px 8px",fontSize:12,fontWeight:600,color:VERT_COLOR[v],textAlign:"left",whiteSpace:"nowrap"}}>{VERT_LABEL[v]}</td>
                  {vals.map((val,i)=><td key={i} style={{padding:"5px 8px",fontSize:12,textAlign:"right",color:val!=null?"#111":"#ddd"}}>{val!=null?metObj.fmt(val):"—"}</td>)}
                  <td style={{padding:"5px 8px",fontSize:12,textAlign:"right",fontWeight:600,color:"#374151",borderLeft:"1px solid #f0f0f0"}}>{smr!=null?metObj.fmt(smr):"—"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </section>
  );
}

// ─── SIDEBAR NAV — collapsed icon rail; hover or the ☰ toggle expands it as an overlay ─────────
function Sidebar({tabs, active, onSelect}) {
  const [hovered, setHovered] = useState(false);
  const [pinned, setPinned] = useState(false);
  const open = hovered || pinned;
  return (
    <div
      onMouseEnter={()=>setHovered(true)}
      onMouseLeave={()=>setHovered(false)}
      style={{
        position:"fixed", top:64, left:0, bottom:0, width: open?216:56,
        background:"#1e1b4b", transition:"width .18s ease", zIndex:150,
        boxShadow: open ? "2px 0 16px rgba(0,0,0,.2)" : "none",
        overflow:"hidden", display:"flex", flexDirection:"column", paddingTop:10,
      }}
    >
      <button
        onClick={()=>setPinned(p=>!p)}
        title={pinned ? "Unpin sidebar" : "Pin sidebar open"}
        style={{
          background:"transparent", border:"none", cursor:"pointer", color:"#a5b4fc",
          padding:"8px 18px", display:"flex", alignItems:"center", gap:14, width:"100%",
        }}
      >
        <span style={{width:20,fontSize:18,textAlign:"center",flexShrink:0}}>☰</span>
        {open && <span style={{fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>{pinned?"Unpin menu":"Menu"}</span>}
      </button>
      <div style={{height:1,background:"rgba(255,255,255,.1)",margin:"6px 16px 10px"}}/>
      {tabs.map(t=>(
        <button
          key={t.id}
          onClick={()=>onSelect(t.id)}
          style={{
            background: active===t.id ? "rgba(99,102,241,.25)" : "transparent",
            borderLeft: active===t.id ? "3px solid #818cf8" : "3px solid transparent",
            border:"none", borderLeftWidth:3, borderLeftStyle:"solid",
            borderLeftColor: active===t.id ? "#818cf8" : "transparent",
            cursor:"pointer", color: active===t.id ? "#fff" : "#c7d2fe",
            fontSize:13, fontWeight: active===t.id ? 700 : 500,
            padding:"10px 18px", display:"flex", alignItems:"center", gap:14,
            width:"100%", textAlign:"left", whiteSpace:"nowrap", flexShrink:0,
          }}
        >
          <span style={{width:20,fontSize:16,textAlign:"center",flexShrink:0}}>{t.icon}</span>
          {open && <span>{t.label}</span>}
        </button>
      ))}
    </div>
  );
}

const TABS = [
  {id:"exec",     label:"Executive Summary",     icon:"📋"},
  {id:"vertical", label:"Breakdown by Vertical",  icon:"📈"},
];

function App() {
  const [activeTab, setActiveTab] = useState("exec");
  return (
    <div>
      <div style={{position:"sticky",top:0,zIndex:200}}>
        <div style={{background:"#1e1b4b",padding:"14px 24px",display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:36,height:36,borderRadius:10,
            background:"linear-gradient(135deg,#818cf8,#6366f1)",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>📊</div>
          <div>
            <div style={{fontWeight:700,fontSize:16,color:"#fff"}}>Chotot Marketplace Dashboard — Executive Summary Preview</div>
            <div style={{fontSize:11,color:"#a5b4fc"}}>T1~T7/2026 · BigQuery chotot-dwh · <span style={{color:"#fbbf24"}}>T7 chưa đủ tháng, data tới 30/07</span></div>
          </div>
        </div>
      </div>
      <Sidebar tabs={TABS} active={activeTab} onSelect={setActiveTab}/>
      <div style={{paddingLeft:56}}>
        {activeTab==="exec"     && <ExecSummary/>}
        {activeTab==="vertical" && <VerticalSection/>}
      </div>
      <div style={{height:60}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
