<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chotot Marketplace Dashboard — Executive Summary Preview</title>
<!--
  PREVIEW BRANCH: exec-summary-mtm-source
  Not run through build.js (no Node available when this was authored) — uses in-browser Babel.
  Run `node build.js` before this is ever merged/deployed to production.
  Scope: Executive Summary section only. DAU/DWL/Total Lead now sourced from
  chotot-dwh.ct_digital.mtm_chotot_vertical_dau_mau (vertical='Chotot', summed across platform).
  MAU / MAU w/Lead / DAU-MAU untouched — still the previous hardcoded values. KPI untouched.
-->
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#111827;font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:4px}
section{padding:28px 24px 0;scroll-margin-top:114px}
.section-title{font-size:15px;font-weight:700;color:#1f2937;margin-bottom:16px;
  display:flex;align-items:center;gap:8px}
.section-title::before{content:'';display:block;width:4px;height:18px;background:#6366f1;border-radius:2px}
</style>
</head>
<body>

<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const DATA_AS_OF = "2026-07-30";
const MONTHS = ["2026-01", "2026-02", "2026-03", "2026-04", "2026-05", "2026-06", "2026-07"];
const ML     = {"2026-01":"T1/26", "2026-02":"T2/26", "2026-03":"T3/26", "2026-04":"T4/26", "2026-05":"T5/26", "2026-06":"T6/26", "2026-07":"T7/26*"};

// ─── KPI — three forecast vintages, all platform-total ("All") scope ──────────
// Source: "[Confidential] 2026 MKT Plan & Budget" Google Sheet, tab FC2-Demand,
//   consolidated FC0/FC1/Actual/FC2 table. FC0 = original annual plan (all 12
//   months). FC1 = post-Q1 revision (Apr-Dec only; Jan-Mar already closed).
//   FC2 = post-Q2 revision (Jul-Dec only; Jan-Jun already closed). Months with
//   no forecast for the selected vintage render as "—", not zero.
const KPI_FC0 = {
  "2026-01":{dau:469506,dwl:54013,lead:5171365},
  "2026-02":{dau:424595,dwl:49044,lead:4490033},
  "2026-03":{dau:631959,dwl:76597,lead:7585109},
  "2026-04":{dau:565152,dwl:66203,lead:6376930},
  "2026-05":{dau:588667,dwl:69573,lead:7033343},
  "2026-06":{dau:620600,dwl:71612,lead:7057700},
  "2026-07":{dau:630175,dwl:72780,lead:7326508},
};
const KPI_FC1 = {
  "2026-04":{dau:486111,dwl:63141,lead:5912040},
  "2026-05":{dau:498737,dwl:65524,lead:6566963},
  "2026-06":{dau:539342,dwl:68735,lead:6721820},
  "2026-07":{dau:554034,dwl:69246,lead:6886439},
};
const KPI_FC2 = {
  "2026-07":{dau:455300,dwl:59277,lead:5912618},
};
const KPI_MAU_FC0 = {
  "2026-01":{mau:5859374,mauLead:751867,dauMau:8.0},
  "2026-02":{mau:5017423,mauLead:635843,dauMau:8.5},
  "2026-03":{mau:7613833,mauLead:967003,dauMau:8.3},
  "2026-04":{mau:6647523,mauLead:806821,dauMau:8.5},
  "2026-05":{mau:7135832,mauLead:869614,dauMau:8.2},
  "2026-06":{mau:7339727,mauLead:860439,dauMau:8.5},
  "2026-07":{mau:7397438,mauLead:879364,dauMau:8.5},
};
const KPI_MAU_FC1 = {
  "2026-04":{mau:6740920,mauLead:808602,dauMau:7.2},
  "2026-05":{mau:7030539,mauLead:858833,dauMau:7.1},
  "2026-06":{mau:7456811,mauLead:885527,dauMau:7.2},
  "2026-07":{mau:7693170,mauLead:894372,dauMau:7.2},
};
const KPI_MAU_FC2 = {
  "2026-07":{mau:7246081,mauLead:939684,dauMau:6.28},
};
const FC_OPTIONS = [
  {key:"FC0", label:"FC0 (annual plan)",    kpi:KPI_FC0, kpiMau:KPI_MAU_FC0},
  {key:"FC1", label:"FC1 (post-Q1 revision)",kpi:KPI_FC1, kpiMau:KPI_MAU_FC1},
  {key:"FC2", label:"FC2 (post-Q2 revision)",kpi:KPI_FC2, kpiMau:KPI_MAU_FC2},
];

const METRICS = [
  {key:"dau",    label:"DAU",         color:"#6366f1"},
  {key:"dwl",    label:"DAU w/ Lead", color:"#f59e0b"},
  {key:"lead",   label:"Total Lead",  color:"#10b981"},
  {key:"mau",    label:"MAU",         color:"#8b5cf6"},
  {key:"mauLead",label:"MAU w/ Lead", color:"#ec4899"},
];
const DEMAND_METRICS = METRICS.slice(0,3); // DAU, DwL, Lead

// ─── ACTUALS ───────────────────────────────────────────────────────────────────
// dau/dwl/lead: NEW SOURCE — chotot-dwh.ct_digital.mtm_chotot_vertical_dau_mau,
//   vertical='Chotot', SUM(dau)/SUM(dau_w_lead)/SUM(lead_daily) across platform per day,
//   then AVG (dau/dwl) or SUM (lead) over the month.
// mau/mauLead/dauMau: UNCHANGED — still from the previous chotot_mtm source.
// NOTE: Apr/May lead is ~17-18% higher than the previously-live number (5,626,950 vs
//   4,758,835 and 5,643,038 vs 4,814,123) — every other month agrees within 0.5%. This
//   looks like a pipeline/definition difference between table owners, not confirmed which
//   is correct. Kept as-is per explicit instruction; flag for reconciliation with the
//   mtm_chotot_vertical_dau_mau table owner before this goes to production.
const ACT = {
  "2026-01":{dau:443403,dwl:45723,lead:4391158,mau:6155280,mauLead:621427,dauMau:7.2},
  "2026-02":{dau:372474,dwl:38806,lead:3225907,mau:4519975,mauLead:531858,dauMau:8.2},
  "2026-03":{dau:513729,dwl:58191,lead:6115241,mau:6988156,mauLead:814287,dauMau:7.4},
  "2026-04":{dau:464662,dwl:52276,lead:5626950,mau:5867098,mauLead:698517,dauMau:7.9},
  "2026-05":{dau:452545,dwl:50812,lead:5643038,mau:5830023,mauLead:711174,dauMau:7.7},
  "2026-06":{dau:470361,dwl:49408,lead:4776415,mau:6365402,mauLead:690082,dauMau:7.4},
  "2026-07":{dau:493419,dwl:52139,lead:4736958,mau:6976892,mauLead:759919,dauMau:7.1},
};

// New vs Returning — same new table, SUM(new_dau)/SUM(return_dau) and
// SUM(new_dau_w_lead)/SUM(return_dau_w_lead) across platform per day, then AVG over month.
// Only DAU and DWL are available this way; the source table has no new/return split for
// Lead (event count) or MAU, so "Actual by User Type" below shows DAU/DWL rows only.
const UT_CHOTOT = {
  "2026-01":{dau:{nv:128085,rv:315318}, dwl:{nv:5037,rv:40686}},
  "2026-02":{dau:{nv:94681, rv:277793}, dwl:{nv:4671,rv:34135}},
  "2026-03":{dau:{nv:149578,rv:364151}, dwl:{nv:7383,rv:50807}},
  "2026-04":{dau:{nv:126174,rv:338487}, dwl:{nv:6027,rv:46249}},
  "2026-05":{dau:{nv:118197,rv:334348}, dwl:{nv:6170,rv:44642}},
  "2026-06":{dau:{nv:111275,rv:359086}, dwl:{nv:6361,rv:43047}},
  "2026-07":{dau:{nv:131798,rv:361621}, dwl:{nv:6406,rv:45733}},
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const fmtN = n => n==null?"—": (typeof n==="number"?n.toLocaleString("en-US"):"—");
const pct  = (a,b) => b ? Math.round(a/b*100) : null;
const card = {background:"#fff",borderRadius:12,padding:"20px 22px",boxShadow:"0 1px 4px rgba(0,0,0,.07)"};
const TH   = {padding:"8px 12px",textAlign:"right",fontSize:12,fontWeight:600,color:"#6b7280",borderBottom:"2px solid #e5e7eb"};
const TD   = {padding:"7px 12px",textAlign:"right",fontSize:12,color:"#111"};

// ─── EXECUTIVE SUMMARY (only section in this preview) ─────────────────────────
function ExecSummary() {
  const [fc, setFc] = useState("FC0");
  const fcObj = FC_OPTIONS.find(f=>f.key===fc);
  const KPI_SEL     = fcObj.kpi;
  const KPI_MAU_SEL = fcObj.kpiMau;

  const getPlatUT = (m,key) => UT_CHOTOT[m]?.[key] ?? {nv:0,rv:0};
  const getActVal = (m,key) => {
    if(key==="mau")    return ACT[m]?.mau??0;
    if(key==="mauLead")return ACT[m]?.mauLead??0;
    return ACT[m]?.[key]??0;
  };
  const UT_METRICS = METRICS.filter(m=>m.key==="dau"||m.key==="dwl");

  return (
    <section id="exec">
      <div className="section-title">Executive Summary</div>

      <div style={{...card,marginBottom:20,background:"#eef2ff",border:"1px solid #c7d2fe"}}>
        <div style={{fontSize:12,color:"#3730a3",lineHeight:1.6}}>
          🔎 <b>Preview branch</b> — DAU / DAU w/ Lead / Total Lead now sourced from{" "}
          <code>ct_digital.mtm_chotot_vertical_dau_mau</code> (vertical=&quot;Chotot&quot;, summed
          across platform). MAU / MAU w/ Lead / DAU-MAU are still hardcoded from the live dashboard.<br/>
          ⚠️ Apr/May Total Lead is ~17-18% higher than the currently-live number in this new source
          — every other month agrees within 0.5%. Kept as requested; pending reconciliation with the
          table owner before this replaces production.<br/>
          🆕 <b>FC0 / FC1 / FC2 selector added</b> — sourced from the "2026 MKT Plan &amp; Budget"
          sheet's consolidated FC0/FC1/Actual/FC2 table (platform-total scope, confirmed matching).
          FC1 only covers Apr-Dec, FC2 only covers Jul-Dec — earlier months show "—" for those
          vintages rather than a misleading number.
        </div>
      </div>

      {/* KPI vs Actual table */}
      <div style={{...card,overflowX:"auto",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:12}}>
          <div style={{fontWeight:600,fontSize:13,color:"#374151"}}>
            🎯 {fcObj.label.split(" (")[0]} vs Actual — Toàn Platform
          </div>
          <div style={{display:"flex",gap:4,background:"#f3f4f6",borderRadius:8,padding:3}}>
            {FC_OPTIONS.map(o=>(
              <button key={o.key} onClick={()=>setFc(o.key)} title={o.label} style={{
                padding:"5px 12px",borderRadius:6,border:"none",cursor:"pointer",
                fontSize:12,fontWeight:600,transition:"all .15s",
                background:fc===o.key?"#6366f1":"transparent",
                color:fc===o.key?"#fff":"#6b7280",
              }}>{o.key}</button>
            ))}
          </div>
        </div>
        <div style={{fontSize:11,color:"#9ca3af",marginBottom:10}}>{fcObj.label} — months outside its forecast window show "—".</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead>
            <tr style={{background:"#f8f9ff"}}>
              <th style={TH}>Metric</th>
              {MONTHS.map(m=>(
                <th key={m} colSpan={3} style={{...TH,textAlign:"center",
                  borderLeft:"2px solid #e5e7eb",color:KPI_SEL[m]?"#6366f1":"#d1d5db"}}>
                  {ML[m]} ({fc})
                </th>
              ))}
            </tr>
            <tr style={{background:"#f8f9ff",fontSize:11}}>
              <th style={TH}/>
              {MONTHS.map(m=>(
                <React.Fragment key={m}>
                  <th style={{...TH,borderLeft:"2px solid #e5e7eb",color:"#374151"}}>Actual</th>
                  <th style={{...TH,color:"#6b7280"}}>{fc}</th>
                  <th style={{...TH,color:"#9ca3af"}}>vs {fc}</th>
                </React.Fragment>
              ))}
            </tr>
          </thead>
          <tbody>
            {DEMAND_METRICS.map(met=>(
              <tr key={met.key} style={{borderTop:"1px solid #f0f0f0"}}>
                <td style={{...TD,fontWeight:600,color:met.color,whiteSpace:"nowrap"}}>{met.label}</td>
                {MONTHS.map(m=>{
                  const act=ACT[m][met.key], k=KPI_SEL[m]?.[met.key];
                  const hasK = k!=null;
                  const p=hasK?pct(act,k):null, pC=p>=100?"#059669":p>=85?"#d97706":"#dc2626";
                  return (
                    <React.Fragment key={m}>
                      <td style={{...TD,borderLeft:"2px solid #f0f0f0",fontWeight:600}}>{fmtN(act)}</td>
                      <td style={{...TD,color:"#9ca3af"}}>{hasK?fmtN(k):"—"}</td>
                      <td style={{...TD}}>{hasK?<span style={{color:pC,fontWeight:700,fontSize:12,background:pC+"18",padding:"2px 8px",borderRadius:99}}>{p}%</span>:<span style={{color:"#d1d5db"}}>—</span>}</td>
                    </React.Fragment>
                  );
                })}
              </tr>
            ))}
            <tr><td colSpan={1+MONTHS.length*3} style={{padding:"4px 12px",background:"#f8f9ff",fontSize:11,color:"#9ca3af",borderTop:"2px solid #e5e7eb"}}>MAU Metrics</td></tr>
            {[
              {label:"MAU",     color:"#8b5cf6",getAct:m=>ACT[m].mau,    getTgt:m=>KPI_MAU_SEL[m]?.mau,    fmt:fmtN,     isRatio:false},
              {label:"MAU w/ Lead",color:"#ec4899",getAct:m=>ACT[m].mauLead,getTgt:m=>KPI_MAU_SEL[m]?.mauLead,fmt:fmtN, isRatio:false},
              {label:"DAU/MAU", color:"#14b8a6",getAct:m=>ACT[m].dauMau, getTgt:m=>KPI_MAU_SEL[m]?.dauMau, fmt:n=>n+"%", isRatio:true},
            ].map(({label,color,getAct,getTgt,fmt,isRatio})=>(
              <tr key={label} style={{borderTop:"1px solid #f0f0f0"}}>
                <td style={{...TD,fontWeight:600,color,whiteSpace:"nowrap"}}>{label}</td>
                {MONTHS.map(m=>{
                  const act=getAct(m), k=getTgt(m);
                  const hasK = k!=null;
                  const p=!hasK?null:(isRatio?(act&&k?Math.round(act/k*100):null):pct(act,k));
                  const pC=p>=100?"#059669":p>=85?"#d97706":"#dc2626";
                  return (
                    <React.Fragment key={m}>
                      <td style={{...TD,borderLeft:"2px solid #f0f0f0",fontWeight:600}}>{fmt(act)}</td>
                      <td style={{...TD,color:"#9ca3af"}}>{hasK?fmt(k):"—"}</td>
                      <td style={{...TD}}>{hasK?<span style={{color:pC,fontWeight:700,fontSize:12,background:pC+"18",padding:"2px 8px",borderRadius:99}}>{p}%</span>:<span style={{color:"#d1d5db"}}>—</span>}</td>
                    </React.Fragment>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Actual of total platform */}
      <div style={{...card,overflowX:"auto",marginTop:16}}>
        <div style={{fontWeight:700,fontSize:13,color:"#374151",marginBottom:10}}>🏠 Actual of total platform</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead>
            <tr style={{background:"#f8f9ff"}}>
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",textAlign:"left",minWidth:110}}>Metric</th>
              {MONTHS.map(m=><th key={m} style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",whiteSpace:"nowrap"}}>{ML[m]}</th>)}
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",color:"#6b7280"}}>Avg/Total</th>
            </tr>
          </thead>
          <tbody>
            {METRICS.map(met=>{
              const isLead=met.key==="lead";
              const vals=MONTHS.map(m=>getActVal(m,met.key));
              const nz=vals.filter(v=>v>0).length||1;
              const smr=isLead?vals.reduce((a,x)=>a+x,0):Math.round(vals.reduce((a,x)=>a+x,0)/nz);
              return (
                <tr key={met.key} style={{borderTop:"1px solid #f0f0f0"}}>
                  <td style={{padding:"5px 8px",fontSize:12,fontWeight:600,color:met.color,textAlign:"left"}}>{met.label}</td>
                  {vals.map((v,i)=><td key={i} style={{padding:"5px 8px",fontSize:12,textAlign:"right",color:v?"#111":"#ddd"}}>{v?fmtN(v):"—"}</td>)}
                  <td style={{padding:"5px 8px",fontSize:12,textAlign:"right",fontWeight:600,color:"#374151",borderLeft:"1px solid #f0f0f0"}}>{smr?fmtN(smr):"—"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Actual by User Type — DAU/DWL only (new source has no new/return split for Lead/MAU) */}
      <div style={{...card,overflowX:"auto",marginTop:16}}>
        <div style={{fontWeight:700,fontSize:13,color:"#374151",marginBottom:2}}>👥 Actual by User Type (New vs Returning)</div>
        <div style={{fontSize:11,color:"#9ca3af",marginBottom:8}}>DAU/DWL only — Lead and MAU have no new/return split in the new source yet.</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead>
            <tr style={{background:"#f8f9ff"}}>
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",textAlign:"left",minWidth:110}}>Metric</th>
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",minWidth:80}}>User Type</th>
              {MONTHS.map(m=><th key={m} style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",whiteSpace:"nowrap"}}>{ML[m]}</th>)}
              <th style={{padding:"5px 8px",fontWeight:600,fontSize:11,background:"#f8f9ff",borderBottom:"2px solid #e5e7eb",color:"#6b7280"}}>Avg/Total</th>
            </tr>
          </thead>
          <tbody>
            {UT_METRICS.map(met=>{
              const isLead=met.key==="lead";
              const nvVals=MONTHS.map(m=>getPlatUT(m,met.key).nv);
              const rvVals=MONTHS.map(m=>getPlatUT(m,met.key).rv);
              const nzF=vs=>vs.filter(x=>x>0).length||1;
              const smrN=isLead?nvVals.reduce((a,x)=>a+x,0):Math.round(nvVals.reduce((a,x)=>a+x,0)/nzF(nvVals));
              const smrR=isLead?rvVals.reduce((a,x)=>a+x,0):Math.round(rvVals.reduce((a,x)=>a+x,0)/nzF(rvVals));
              return [
                <tr key={met.key+'-n'} style={{borderTop:"1px solid #f0f0f0"}}>
                  <td rowSpan={2} style={{padding:"5px 8px",fontSize:12,fontWeight:600,color:met.color,textAlign:"left",verticalAlign:"middle"}}>{met.label}</td>
                  <td style={{padding:"5px 8px",fontSize:12,color:"#6366f1",fontWeight:500}}>New</td>
                  {nvVals.map((v,i)=><td key={i} style={{padding:"5px 8px",fontSize:12,textAlign:"right",color:v?"#6366f1":"#ddd"}}>{v?fmtN(v):"—"}</td>)}
                  <td style={{padding:"5px 8px",fontSize:12,textAlign:"right",fontWeight:600,color:"#6366f1",borderLeft:"1px solid #f0f0f0"}}>{fmtN(smrN)}</td>
                </tr>,
                <tr key={met.key+'-r'}>
                  <td style={{padding:"5px 8px",fontSize:12,color:"#059669",fontWeight:500}}>Returning</td>
                  {rvVals.map((v,i)=><td key={i} style={{padding:"5px 8px",fontSize:12,textAlign:"right",color:v?"#059669":"#ddd"}}>{v?fmtN(v):"—"}</td>)}
                  <td style={{padding:"5px 8px",fontSize:12,textAlign:"right",fontWeight:600,color:"#059669",borderLeft:"1px solid #f0f0f0"}}>{fmtN(smrR)}</td>
                </tr>
              ];
            })}
          </tbody>
        </table>
      </div>

    </section>
  );
}

function App() {
  return (
    <div>
      <div style={{position:"sticky",top:0,zIndex:200}}>
        <div style={{background:"#1e1b4b",padding:"14px 24px",display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:36,height:36,borderRadius:10,
            background:"linear-gradient(135deg,#818cf8,#6366f1)",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>📊</div>
          <div>
            <div style={{fontWeight:700,fontSize:16,color:"#fff"}}>Chotot Marketplace Dashboard — Executive Summary Preview</div>
            <div style={{fontSize:11,color:"#a5b4fc"}}>T1~T7/2026 · BigQuery chotot-dwh · <span style={{color:"#fbbf24"}}>T7 chưa đủ tháng, data tới 30/07</span></div>
          </div>
        </div>
      </div>
      <ExecSummary/>
      <div style={{height:60}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
